name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run offline regression and reference negative-control tests
        run: npm test

      - name: Verify strict routing through the pinned Pi host
        run: npm exec --yes --ignore-scripts --package=@earendil-works/pi-coding-agent@0.87.1 -- npm run test:host

      - name: Validate npm package contents
        run: npm pack --dry-run
